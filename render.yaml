services:
  # --- Backend: FastAPI gateway (a real, persistent web service) ---
  - type: web
    name: drishti-backend
    runtime: python
    plan: free
    rootDir: drishti-backend/python/gateway
    buildCommand: "pip install -r ../../requirements-deploy.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      # Set this to your Neon/Supabase PostgreSQL connection string in the
      # Render dashboard (Environment tab) -- do not commit real credentials
      # to this file or the repository.
      - key: DATABASE_URL
        sync: false
      # Set this to your deployed drishti-frontend static site URL (Render
      # gives you one automatically, e.g. https://drishti-frontend.onrender.com)
      # once you know it. Comma-separate multiple origins if needed.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MODEL_VERSION
        value: "1.0-deployed"

  # --- Frontend: static React/Vite build, served from Render's CDN ---
  # A static site never sleeps the way the free web service above does --
  # it's just files on a CDN, no process to spin down -- so only the
  # backend needs the UptimeRobot keep-alive described in
  # docs/DEPLOYMENT.md.
  - type: web
    runtime: static
    name: drishti-frontend
    plan: free
    rootDir: drishti-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked into the build at build time (Vite env vars are not
      # runtime-configurable) -- set this to your drishti-backend URL from
      # the service above once you know it, e.g.
      # https://drishti-backend.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
